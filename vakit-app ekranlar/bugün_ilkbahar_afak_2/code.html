<script>
  (function() {
    let secondsLeft = 1 * 3600 + 25 * 60 + 40;
    const timerEl = document.getElementById('countdown-timer');
    const progressEl = document.getElementById('countdown-progress');
    const totalDuration = 86 * 60; // İmsak ile Güneş arası 86 dk
    const circumference = 2 * Math.PI * 108;

    function updateTimer() {
      if (secondsLeft <= 0) return;
      secondsLeft--;
      const hours = Math.floor(secondsLeft / 3600);
      const minutes = Math.floor((secondsLeft % 3600) / 60);
      const seconds = secondsLeft % 60;

      const pad = (n) => String(n).padStart(2, '0');
      if (timerEl) {
        timerEl.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      }

      if (progressEl) {
        const progress = Math.max(0, Math.min(1, (totalDuration - secondsLeft) / totalDuration));
        const offset = circumference * (1 - progress);
        progressEl.style.strokeDashoffset = offset;
      }
    }

    setInterval(updateTimer, 1000);
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe pointer-events-none px-margin-mobile pb-space-sm" data-active-classes="text-primary font-medium"><div class="pointer-events-auto max-w-md mx-auto h-16 rounded-full bg-white/70 backdrop-blur-2xl shadow-[0_8px_30px_rgba(43,51,47,0.12)] border border-white/60 flex items-center justify-around px-space-sm"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-sm transition-colors text-primary font-semibold" data-path="today" href="#"><span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">schedule</span><span class="font-label-sm text-label-sm mt-0.5">Bugün</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-sm text-on-surface-variant hover:text-on-surface transition-colors" data-path="calendar" href="#"><span class="material-symbols-outlined text-[22px]">calendar_month</span><span class="font-label-sm text-label-sm mt-0.5">Takvim</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-sm text-on-surface-variant hover:text-on-surface transition-colors" data-path="qibla" href="#"><span class="material-symbols-outlined text-[22px]">explore</span><span class="font-label-sm text-label-sm mt-0.5">Kıble</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] px-space-sm text-on-surface-variant hover:text-on-surface transition-colors" data-path="settings" href="#"><span class="material-symbols-outlined text-[22px]">tune</span><span class="font-label-sm text-label-sm mt-0.5">Ayarlar</span></a></div></nav></body></html>
