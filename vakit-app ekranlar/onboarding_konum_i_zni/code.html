<!DOCTYPE html>

<html lang="tr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f3fbf5;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary-fixed-dim": "#e9c349", "primary-fixed": "#ccebc7", "surface": "#f3fbf5", "on-primary-fixed-variant": "#334d33", "secondary-fixed": "#ffe088", "primary-container": "#8ba888", "error-container": "#ffdad6", "on-tertiary": "#ffffff", "on-secondary-fixed-variant": "#574500", "background": "#f3fbf5", "error": "#ba1a1a", "on-error-container": "#93000a", "on-error": "#ffffff", "on-tertiary-fixed-variant": "#3f4945", "on-background": "#151d1a", "inverse-surface": "#2a322e", "surface-container": "#e7f0ea", "on-primary-fixed": "#07200b", "inverse-on-surface": "#eaf3ec", "on-secondary-fixed": "#241a00", "outline": "#737970", "on-secondary": "#ffffff", "tertiary": "#57615c", "surface-variant": "#dce5de", "tertiary-fixed": "#dbe5df", "secondary-container": "#fed65b", "on-surface-variant": "#434841", "surface-container-high": "#e2eae4", "on-secondary-container": "#745c00", "outline-variant": "#c3c8bf", "surface-container-low": "#edf6ef", "surface-dim": "#d4dcd6", "tertiary-fixed-dim": "#bfc9c3", "on-primary": "#ffffff", "tertiary-container": "#99a39e", "surface-tint": "#4a6549", "secondary": "#735c00", "primary-fixed-dim": "#b0cfad", "on-tertiary-fixed": "#151d1a", "on-primary-container": "#243d24", "on-tertiary-container": "#303935", "surface-bright": "#f3fbf5", "on-surface": "#151d1a", "inverse-primary": "#b0cfad", "surface-container-lowest": "#ffffff", "surface-container-highest": "#dce5de", "primary": "#4a6549" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "margin-mobile": "1.25rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "margin": "1.5rem", "space-xl": "2.25rem", "gutter-sm": "0.75rem", "gutter": "1rem", "space-sm": "0.5rem" }, "fontFamily": { "body-lg": ["Manrope"], "display-countdown": ["Manrope"], "label-sm": ["Manrope"], "headline-lg": ["Manrope"], "headline-md": ["Manrope"], "label-md": ["Manrope"], "display-countdown-mobile": ["Manrope"], "body-md": ["Manrope"], "headline-lg-mobile": ["Manrope"], "label-lg": ["Manrope"], "body-sm": ["Manrope"] }, "fontSize": { "body-lg": ["17px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "400" }], "display-countdown": ["72px", { "lineHeight": "76px", "letterSpacing": "-0.04em", "fontWeight": "200" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "600" }], "headline-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }], "display-countdown-mobile": ["56px", { "lineHeight": "60px", "letterSpacing": "-0.04em", "fontWeight": "200" }], "body-md": ["15px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "400" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-lg select-none">
<!-- Top Navigation & Flow Indicators -->
<div class="flex items-center justify-between pt-space-md pb-space-md">
<!-- Step Indicator Dots (Dot 2 active of 3) -->
<div class="flex items-center space-x-2">
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-6 h-1.5 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
</div>
<!-- Skip Action Button -->
<button class="font-label-md text-label-md text-tertiary hover:text-on-surface transition-colors py-1 px-2.5 rounded-full" type="button">
      Atla
    </button>
</div>
<!-- Center Graphic: Ambient Radar Glass Card -->
<div class="relative w-full aspect-[4/3] my-space-md flex items-center justify-center">
<!-- Atmospheric Ambient Glows behind the card -->
<div class="absolute w-44 h-44 rounded-full bg-primary-fixed-dim/40 blur-3xl -top-3 -left-3 pointer-events-none"></div>
<div class="absolute w-40 h-40 rounded-full bg-secondary-fixed/30 blur-2xl -bottom-3 -right-3 pointer-events-none"></div>
<!-- Glassmorphic Card Container -->
<div class="relative w-full h-full rounded-xl bg-surface-container-lowest/80 backdrop-blur-xl shadow-sm flex items-center justify-center overflow-hidden p-space-lg">
<!-- Subtle Compass/Radar Vector Graphic -->
<svg class="absolute inset-0 w-full h-full text-primary" fill="none" viewbox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
<!-- Coordinate Grid Lines -->
<line stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.08" x1="160" x2="160" y1="20" y2="220"></line>
<line stroke="currentColor" stroke-dasharray="3 3" stroke-opacity="0.08" x1="30" x2="290" y1="120" y2="120"></line>
<!-- Concentric Radial Waves -->
<circle cx="160" cy="120" r="95" stroke="currentColor" stroke-opacity="0.06" stroke-width="1"></circle>
<circle cx="160" cy="120" r="70" stroke="currentColor" stroke-dasharray="4 4" stroke-opacity="0.12" stroke-width="1"></circle>
<circle cx="160" cy="120" r="45" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.2"></circle>
<!-- Celestial Orbit Dots & Minute Accents -->
<circle cx="160" cy="25" fill="currentColor" fill-opacity="0.3" r="2"></circle>
<circle cx="230" cy="85" fill="currentColor" fill-opacity="0.35" r="2.5"></circle>
<circle cx="95" cy="150" fill="currentColor" fill-opacity="0.25" r="1.5"></circle>
<circle cx="205" cy="175" fill="#fed65b" fill-opacity="0.7" r="3"></circle>
<circle cx="110" cy="65" fill="currentColor" fill-opacity="0.3" r="2"></circle>
</svg>
<!-- Center Dynamic Pin & Alignment Rings -->
<div class="relative flex items-center justify-center">
<!-- Outermost Pulse Ring -->
<div class="absolute w-28 h-28 rounded-full bg-primary-fixed/30 animate-ping opacity-30"></div>
<!-- Middle Soft Aura -->
<div class="absolute w-20 h-20 rounded-full bg-primary-container/20"></div>
<!-- Inner Glass Disc Pin Holder -->
<div class="relative w-14 h-14 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">
            location_on
          </span>
</div>
<!-- North Indicator Badge -->
<div class="absolute -top-11 flex flex-col items-center">
<span class="font-label-sm text-label-sm text-primary tracking-widest font-semibold bg-surface-container-high/80 px-2 py-0.5 rounded-full shadow-sm">
            39.92° K
          </span>
<div class="w-0.5 h-1.5 bg-primary/40 mt-0.5"></div>
</div>
</div>
</div>
</div>
<!-- Content Block: Title & Context -->
<div class="text-center px-space-xs mt-space-sm mb-space-lg flex flex-col items-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-semibold tracking-tight">
      Doğru Vakitler İçin Konumun
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-sm max-w-xs leading-relaxed">
      Bulunduğun şehrin coğrafi koordinatlarına göre güneşin ve ezanın kesin anını saniyelerle hesaplar.
    </p>
</div>
<!-- Interactive Action Buttons -->
<div class="flex flex-col space-y-3 w-full mt-auto">
<!-- Primary Action: Konumumu Kullan -->
<button class="w-full bg-primary active:bg-on-primary-container text-on-primary font-label-lg text-label-lg h-14 rounded-full flex items-center justify-center space-x-2 shadow-md hover:shadow-lg transition-all duration-200" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">
        near_me
      </span>
<span>Konumumu Kullan</span>
</button>
<!-- Secondary Action: Manuel Arama -->
<button class="w-full bg-surface-container-high active:bg-surface-container-highest text-on-surface font-label-lg text-label-lg h-14 rounded-full flex items-center justify-center space-x-2 shadow-sm transition-all duration-200" type="button">
<span class="material-symbols-outlined text-[20px]">
        search
      </span>
<span>Şehir Seç</span>
</button>
</div>
<!-- Privacy Trust Footnote -->
<div class="flex items-center justify-center space-x-1.5 mt-space-md pt-space-xs text-tertiary">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">
      verified_user
    </span>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">
      Konumun yalnızca cihazında kalır, asla kaydedilmez veya paylaşılmaz.
    </span>
</div>
</div></main></body></html>
