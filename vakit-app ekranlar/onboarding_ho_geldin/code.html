mary": "#b0cfad", "surface-container-lowest": "#ffffff", "surface-container-highest": "#dce5de", "primary": "#4a6549" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "margin-mobile": "1.25rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "margin": "1.5rem", "space-xl": "2.25rem", "gutter-sm": "0.75rem", "gutter": "1rem", "space-sm": "0.5rem" }, "fontFamily": { "body-lg": ["Manrope"], "display-countdown": ["Manrope"], "label-sm": ["Manrope"], "headline-lg": ["Manrope"], "headline-md": ["Manrope"], "label-md": ["Manrope"], "display-countdown-mobile": ["Manrope"], "body-md": ["Manrope"], "headline-lg-mobile": ["Manrope"], "label-lg": ["Manrope"], "body-sm": ["Manrope"] }, "fontSize": { "body-lg": ["17px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "400" }], "display-countdown": ["72px", { "lineHeight": "76px", "letterSpacing": "-0.04em", "fontWeight": "200" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "600" }], "headline-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }], "display-countdown-mobile": ["56px", { "lineHeight": "60px", "letterSpacing": "-0.04em", "fontWeight": "200" }], "body-md": ["15px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "400" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative overflow-hidden select-none">
<!-- Atmospheric Sky Canvas & Geometric Watermark -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<!-- Dawn Gradient Light Aura -->
<div class="absolute -top-32 -left-20 w-96 h-96 rounded-full bg-secondary-fixed opacity-30 blur-3xl"></div>
<div class="absolute top-1/4 right-0 w-80 h-80 rounded-full bg-primary-fixed opacity-40 blur-3xl"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-[520px] bg-gradient-to-b from-surface-bright/20 via-surface-container-low/60 to-surface-container opacity-80 pointer-events-none"></div>
<!-- Soft Ambient Micro Stars / Dew Glows -->
<svg class="absolute inset-0 w-full h-full text-secondary opacity-25" xmlns="http://www.w3.org/2000/svg">
<circle cx="18%" cy="14%" fill="currentColor" r="1.5"></circle>
<circle cx="82%" cy="19%" fill="currentColor" r="1"></circle>
<circle cx="34%" cy="28%" fill="currentColor" r="1.2"></circle>
<circle cx="76%" cy="38%" fill="currentColor" r="1.8"></circle>
<circle cx="12%" cy="46%" fill="currentColor" r="1"></circle>
<circle cx="88%" cy="54%" fill="currentColor" r="1.4"></circle>
<circle cx="26%" cy="62%" fill="currentColor" r="1"></circle>
</svg>
<!-- Ultra-subtle Islamic Geometric Motif (Under 5% Opacity) -->
<svg class="absolute top-16 left-1/2 -translate-x-1/2 w-[340px] h-[340px] text-primary opacity-[0.035]" fill="none" stroke="currentColor" stroke-width="0.75" viewbox="0 0 100 100">
<circle cx="50" cy="50" r="42" stroke-dasharray="1 3"></circle>
<rect height="60" rx="4" transform="rotate(45 50 50)" width="60" x="20" y="20"></rect>
<rect height="60" rx="4" width="60" x="20" y="20"></rect>
<circle cx="50" cy="50" r="14"></circle>
<circle cx="50" cy="50" fill="currentColor" r="3"></circle>
</svg>
</div>
<!-- Main Content Container with Deliberate Vertical Rhythm -->
<div class="relative z-10 px-margin flex flex-col justify-between pt-8 pb-8 min-h-[calc(100vh-4rem)]">
<!-- Top Action / Quick Locale Cue -->
<div class="w-full flex items-center justify-between">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-lowest/80 shadow-sm backdrop-blur-md">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-tertiary tracking-wider uppercase">Fecr Vakti Yakın</span>
</div>
<button aria-label="Dili Değiştir" class="w-9 h-9 rounded-full bg-surface-container-lowest/80 shadow-sm flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">translate</span>
</button>
</div>
<!-- Center Hero Sanctuary: Logo, Typography, Essence -->
<div class="flex flex-col items-center text-center mt-6 mb-4">
<!-- Logo Vessel with Soft Breathing Glow -->
<div class="relative mb-6 group cursor-pointer" id="brand-emblem-container">
<div class="absolute inset-0 rounded-full bg-primary-fixed-dim/40 blur-xl scale-125 transition-transform duration-700 ease-out group-hover:scale-150"></div>
<div class="relative w-28 h-28 rounded-2xl p-4 bg-surface-container-lowest/90 shadow-md backdrop-blur-xl flex items-center justify-center transition-transform duration-500 hover:scale-105">
<img alt="Vakit Logo" class="w-full h-full object-contain filter drop-shadow-sm select-none" src="https://lh3.googleusercontent.com/aida/AEtjO1WEfsENrOpv4HHqhsNy0bpPfZOG2iS2mBxWluY_-B3dyszRHiN-hDrJlkIUsFNztanL-FJjOG3N5_XRLoyNm1CeOiqA4Vf4dAKmy0npovD1ziR3BzEUEPGFlx1Wd67fiyvo-QbH-sEWap5L65TqIM0Gz3i8Bf6WJ2QIaY0NwfdoSS_yaioAghZgFVCfgSNlN5UQolFuwUN7Y21kI3ixHhtdWzmspmyNpKGGCt64RQjUfOU8lvmN8IGpgL4"/>
</div>
</div>
<!-- App Brand Title -->
<div class="space-y-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight font-medium">
          Vakit
        </h1>
<p class="font-body-md text-body-md text-tertiary italic tracking-wide">
          “Vaktin nefesini hisset.”
        </p>
</div>
<!-- Mindful Micro-Pill Tag -->
<div class="mt-5 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container/70 backdrop-blur-md shadow-sm">
<span class="material-symbols-outlined text-primary text-[16px]">wb_twilight</span>
<span class="font-label-md text-label-md text-on-surface-variant">Huzurlu, berrak ve sade ritüel rehberi</span>
</div>
</div>
<!-- Bottom Stage: Vector Horizon, Stepper, Interactive CTA -->
<div class="w-full flex flex-col items-center space-y-6">
<!-- Minimalist Islamic Landscape Horizon Silhouette -->
<div class="w-full h-20 relative overflow-hidden flex items-end">
<svg class="w-full h-full text-surface-container-high/90" fill="currentColor" preserveaspectratio="none" viewbox="0 0 400 90">
<!-- Distant Misty Ridge -->
<path d="M0,58 Q60,35 130,52 T270,42 Q330,30 400,48 L400,90 L0,90 Z" opacity="0.45"></path>
<!-- Midground Ridge with Mosque Silhouette and Delicate Crescent -->
<path d="M0,68 Q75,54 165,66 Q195,64 200,52 Q201,36 208,36 Q215,36 216,52 Q221,64 250,68 Q335,74 400,60 L400,90 L0,90 Z" opacity="0.8"></path>
<path d="M208,31 L208,36 M208,27 A3,3 0 1,1 210,32" fill="none" opacity="0.95" stroke="currentColor" stroke-width="1.2"></path>
<!-- Foreground Rolling Dune -->
<path d="M0,78 Q90,68 180,82 Q280,72 400,80 L400,90 L0,90 Z"></path>
</svg>
<!-- Floating Golden Moon Reflection Orb -->
<div class="absolute right-12 top-2 flex items-center justify-center">
<div class="w-7 h-7 rounded-full bg-secondary-fixed/50 blur-sm absolute"></div>
<span class="material-symbols-outlined text-secondary-fixed-dim text-lg relative z-10" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
</div>
<!-- Page Indicator Stepper (Active 1 of 3) -->
<div aria-label="İlerleme adımları" class="flex items-center gap-2" role="tablist">
<div aria-label="1. Adım" aria-selected="true" class="w-7 h-1.5 rounded-full bg-primary transition-all duration-300 shadow-sm" role="tab"></div>
<div aria-label="2. Adım" aria-selected="false" class="w-1.5 h-1.5 rounded-full bg-surface-dim hover:bg-outline-variant transition-colors" role="tab"></div>
<div aria-label="3. Adım" aria-selected="false" class="w-1.5 h-1.5 rounded-full bg-surface-dim hover:bg-outline-variant transition-colors" role="tab"></div>
</div>
<!-- Action Button and Quiet Value Proposition -->
<div class="w-full space-y-3">
<button class="group relative w-full h-14 rounded-full bg-primary hover:bg-surface-tint active:scale-[0.98] transition-all duration-200 shadow-md flex items-center justify-center text-on-primary font-label-lg text-label-lg overflow-hidden" id="start-button" type="button">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/15 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-in-out"></div>
<span class="mr-2 tracking-wide font-medium">Başla</span>
<span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
<p class="text-center font-body-sm text-body-sm text-tertiary">
          Sakin, sade ve reklamsız ibadet deneyimi
        </p>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const emblem = document.getElementById('brand-emblem-container');
    const startBtn = document.getElementById('start-button');
    
    if (emblem) {
      emblem.addEventListener('click', function() {
        this.classList.add('scale-95');
        setTimeout(() => {
          this.classList.remove('scale-95');
        }, 150);
      });
    }

    if (startBtn) {
      startBtn.addEventListener('click', function() {
        this.classList.add('opacity-90');
        setTimeout(() => {
          this.classList.remove('opacity-90');
        }, 200);
      });
    }
  })();
</script></main></body></html>
